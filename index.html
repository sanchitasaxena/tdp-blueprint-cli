<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Blueprints — Platform Engineer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080808;
        --terminal: #171717;
        --text: #dedede;
        --muted: #929292;
        --pink: #f04e98;
        --green: #8ed6a3;
        --line: #333;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      .page-title {
        overflow: hidden;
        padding: 5px 0 29px;
        color: var(--pink);
        font-size: clamp(24px, 4vw, 42px);
        font-weight: 700;
        letter-spacing: .01em;
        line-height: 1.15;
        white-space: nowrap;
      }

      .window {
        display: flex;
        width: min(100%, 1120px);
        height: calc(100vh - 82px);
        min-height: 430px;
        flex-direction: column;
        margin: 0 auto;
        background: var(--terminal);
        box-shadow: 0 0 0 1px #222;
      }

      .window-bar {
        display: flex;
        height: 36px;
        flex: 0 0 36px;
        align-items: center;
        justify-content: space-between;
        padding: 0 13px;
        background: #ededed;
        color: #777;
      }

      .window-controls { display: flex; gap: 18px; font-size: 13px; }
      .window-title { color: #555; font: 11px Arial, sans-serif; }
      .close { font: 16px Arial, sans-serif; }

      .terminal {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        padding: 17px 18px 0;
        font-size: 12px;
        line-height: 1.6;
      }

      .output {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding: 0 2px 20px 0;
        scrollbar-color: #494949 transparent;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .line { min-height: 1.6em; }
      .line.command { color: #f4f4f4; }
      .line.muted { color: var(--muted); }
      .line.section { margin-top: 13px; color: #f2f2f2; }
      .line.success { color: var(--green); }
      .line.error { color: #ff8c8c; }
      .line.pink { color: var(--pink); }

      .input-dock {
        flex: 0 0 auto;
        border-top: 1px solid #303030;
        padding: 11px 0 13px;
        background: var(--terminal);
      }

      .active-line {
        display: flex;
        min-height: 24px;
        align-items: baseline;
        gap: 7px;
      }

      .prompt-label {
        flex: 0 0 auto;
        color: #f1f1f1;
        white-space: pre-wrap;
      }

      .cli-input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        padding: 0;
        background: transparent;
        color: #fff;
        caret-color: var(--pink);
        font: inherit;
      }

      .cli-input:disabled { opacity: .65; }
      .input-hint { margin-top: 5px; color: #777; font-size: 10px; }

      @media (max-width: 600px) {
        .page-title { padding-bottom: 20px; }
        .window { height: calc(100vh - 72px); min-height: 390px; }
        .terminal { padding: 14px 13px 0; font-size: 11px; }
        .input-hint { font-size: 9px; }
      }
    </style>
  </head>
  <body>
    <header class="page-title">Create Blueprints- Platform Engineer</header>
    <main class="window">
      <div class="window-bar" aria-hidden="true">
        <div class="window-controls"><span>○</span><span>‹›</span><span>□</span></div>
        <span class="window-title">Blueprint setup</span>
        <span class="close">×</span>
      </div>

      <section class="terminal" aria-label="Interactive blueprint CLI">
        <div class="output" id="output" role="log" aria-live="polite"></div>
        <div class="input-dock">
          <div class="active-line">
            <label class="prompt-label" id="prompt-label" for="cli-input"></label>
            <input id="cli-input" class="cli-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input">
          </div>
          <div class="input-hint">Enter to submit · blank accepts the default · use comma-separated numbers for lists · Ctrl+C cancels</div>
        </div>
      </section>
    </main>

    <script>
      const output = document.querySelector("#output");
      const promptLabel = document.querySelector("#prompt-label");
      const input = document.querySelector("#cli-input");
      const shellPrompt = "olivia.corley@hashicorp ~ $";

      const projects = ["Project_1", "Project_2", "Project_3", "Project_4", "Project_5", "Project_6"];
      const environments = ["Prod", "Test", "Dev", "Stage"];
      const versions = ["5.10.0", "5.9.0", "5.8.0", "5.7.0"];
      const variables = [
        { name: "bucket_name", type: "string", description: "The name of the S3 bucket.", defaults: [] },
        { name: "retention_days", type: "list(number)", description: "A list of valid retention periods (in days) that users can choose from.", defaults: ["7", "14", "30"] },
        { name: "allow_storage_classes", type: "list(string)", description: "A list of storage classes users may choose from.", defaults: ["Standard", "Standard_IA"] }
      ];

      let step = "command";
      let activePrompt = null;
      let commandHistory = [];
      let historyIndex = 0;
      let tagCount = 0;
      let variableIndex = 0;
      let blueprint;

      function appendLine(text = "", style = "") {
        const line = document.createElement("div");
        line.className = `line ${style}`.trim();
        line.textContent = text;
        output.append(line);
        output.scrollTop = output.scrollHeight;
      }

      function ask(label, defaultValue, handler) {
        activePrompt = { label, defaultValue, handler };
        step = label === shellPrompt ? "command" : step;
        promptLabel.textContent = defaultValue === undefined
          ? `${label} `
          : `${label} [${defaultValue}]: `;
        input.value = "";
        input.placeholder = "";
        input.disabled = false;
        input.focus();
        output.scrollTop = output.scrollHeight;
      }

      function echoPrompt(answer) {
        const { label, defaultValue } = activePrompt;
        const prompt = defaultValue === undefined ? label : `${label} [${defaultValue}]:`;
        appendLine(`${prompt}${answer ? ` ${answer}` : ""}`, label === shellPrompt ? "command" : "");
      }

      function submit() {
        if (!activePrompt || input.disabled) return;
        const typed = input.value.trim();
        const answer = typed || activePrompt.defaultValue || "";
        const handler = activePrompt.handler;
        echoPrompt(answer);
        input.value = "";
        handler(typed, answer);
      }

      function beginShell() {
        step = "command";
        ask(shellPrompt, undefined, handleCommand);
      }

      function handleCommand(typed, command) {
        const normalized = command.trim().toLowerCase();
        if (normalized === "help") {
          appendLine("Available commands:");
          appendLine("  tfctl blueprint create   Create a blueprint", "muted");
          appendLine("  clear                    Clear the terminal", "muted");
          appendLine("  help                     Show this help", "muted");
          beginShell();
          return;
        }
        if (normalized === "clear") {
          output.replaceChildren();
          beginShell();
          return;
        }
        if (normalized === "tfctl blueprint create") {
          beginWizard();
          return;
        }
        appendLine(`tfctl: command not found: ${command || "(empty input)"}`, "error");
        beginShell();
      }

      function beginWizard() {
        blueprint = {
          name: "",
          description: "",
          source: "terraform-aws-modules/s3-bucket/aws",
          version: versions[0],
          projects: [projects[2]],
          environments: [environments[1]],
          tags: [],
          selectedVariables: [],
          variableValues: {}
        };
        tagCount = 0;
        appendLine("Starting blueprint creation...", "muted");
        askName();
      }

      function askName() {
        step = "name";
        ask("Enter blueprint name:", "my-s3-blueprint", (typed, answer) => {
          if (!answer.trim()) return invalid("Blueprint name cannot be empty.", askName);
          blueprint.name = answer.trim();
          askDescription();
        });
      }

      function askDescription() {
        step = "description";
        ask("Enter blueprint description:", "S3 bucket blueprint for dev workloads", (typed, answer) => {
          blueprint.description = answer.trim();
          askSource();
        });
      }

      function askSource() {
        step = "source";
        ask("Enter the registry module source:", blueprint.source, (typed, answer) => {
          if (!answer.trim()) return invalid("Module source cannot be empty.", askSource);
          blueprint.source = answer.trim();
          askVersion();
        });
      }

      function listChoices(title, choices, selected = []) {
        appendLine(title, "section");
        choices.forEach((choice, index) => {
          const value = typeof choice === "string" ? choice : choice.name;
          const mark = selected.includes(value) ? "x" : " ";
          appendLine(`[${mark}] ${index + 1}. ${value}`);
        });
      }

      function parseOne(value, choices, defaultIndex) {
        if (!value) return choices[defaultIndex];
        const index = Number.parseInt(value, 10);
        if (Number.isInteger(index) && String(index) === value && index >= 1 && index <= choices.length) {
          return choices[index - 1];
        }
        return choices.find(choice => choice.toLowerCase() === value.toLowerCase()) || null;
      }

      function parseMany(value, choices, defaults) {
        if (!value) return defaults;
        const selected = [];
        for (const token of value.split(",").map(part => part.trim()).filter(Boolean)) {
          const index = Number.parseInt(token, 10);
          const choice = Number.isInteger(index) && String(index) === token
            ? choices[index - 1]
            : choices.find(item => item.toLowerCase() === token.toLowerCase());
          if (!choice) return null;
          if (!selected.includes(choice)) selected.push(choice);
        }
        return selected.length ? selected : null;
      }

      function askVersion() {
        step = "version";
        listChoices("Select module version:", versions, [blueprint.version]);
        ask("Version", "1", (typed, answer) => {
          const version = parseOne(answer, versions, 0);
          if (!version) return invalid("Choose a version number from the list.", askVersion);
          blueprint.version = version;
          askProjects();
        });
      }

      function askProjects() {
        step = "projects";
        listChoices("Select Project(s):", projects, blueprint.projects);
        ask("Project numbers (comma-separated)", "3", (typed, answer) => {
          const selected = parseMany(answer, projects, [projects[2]]);
          if (!selected) return invalid("Enter one or more project numbers from the list.", askProjects);
          blueprint.projects = selected;
          askEnvironments();
        });
      }

      function askEnvironments() {
        step = "environments";
        listChoices("Select environment(s):", environments, blueprint.environments);
        ask("Environment numbers (comma-separated)", "2", (typed, answer) => {
          const selected = parseMany(answer, environments, [environments[1]]);
          if (!selected) return invalid("Enter one or more environment numbers from the list.", askEnvironments);
          blueprint.environments = selected;
          askTags();
        });
      }

      function askTags() {
        step = "tags";
        appendLine("TAGS", "section");
        appendLine("----", "muted");
        ask("Add tags to the resulting workspace or stack? (Y/n)", "Y", (typed, answer) => {
          if (/^(n|no)$/i.test(answer)) {
            blueprint.tags = [];
            askVariables();
            return;
          }
          if (!/^(y|yes)$/i.test(answer)) return invalid("Enter Y or N.", askTags);
          tagCount = 0;
          askTagValue();
        });
      }

      function askTagValue() {
        const defaults = ["environment=test", "owner=platform-team", "cost_center=4451"];
        const defaultValue = defaults[tagCount];
        ask("Enter tag (key=value)", defaultValue, (typed, answer) => {
          const separator = answer.indexOf("=");
          if (separator <= 0 || !answer.slice(separator + 1).trim()) {
            return invalid("Use key=value format, for example environment=test.", askTagValue);
          }
          const key = answer.slice(0, separator).trim();
          const value = answer.slice(separator + 1).trim();
          blueprint.tags.push({ key, value });
          tagCount += 1;
          askAnotherTag();
        });
      }

      function askAnotherTag() {
        const defaultValue = tagCount === 1 ? "Y" : "N";
        ask("Add another tag? (y/N)", defaultValue, (typed, answer) => {
          if (/^(y|yes)$/i.test(answer)) {
            if (tagCount >= 10) {
              appendLine("Maximum of 10 tags reached.", "muted");
              return askVariables();
            }
            askTagValue();
          } else if (/^(n|no)$/i.test(answer)) {
            askVariables();
          } else {
            invalid("Enter Y or N.", askAnotherTag);
          }
        });
      }

      function askVariables() {
        step = "variables";
        listChoices("VARIABLE INPUTS — select variables to configure:", variables.map(item => `${item.name} (${item.type})`), [
          "retention_days (list(number))",
          "allow_storage_classes (list(string))"
        ]);
        ask("Variable numbers (comma-separated, or none)", "2,3", (typed, answer) => {
          if (/^(none|no|skip)$/i.test(answer)) {
            blueprint.selectedVariables = [];
            showReview();
            return;
          }
          const labels = variables.map(item => `${item.name} (${item.type})`);
          const selected = parseMany(answer, labels, [labels[1], labels[2]]);
          if (!selected) return invalid("Enter one or more variable numbers from the list.", askVariables);
          blueprint.selectedVariables = variables.filter(item => selected.includes(`${item.name} (${item.type})`));
          variableIndex = 0;
          askVariableValues();
        });
      }

      function askVariableValues() {
        if (variableIndex >= blueprint.selectedVariables.length) {
          showReview();
          return;
        }
        const variable = blueprint.selectedVariables[variableIndex];
        appendLine(`Variable name: ${variable.name}`, "section");
        appendLine(`Variable type: ${variable.type}`);
        appendLine(`Variable description: ${variable.description}`);
        const defaultValue = variable.defaults.length ? variable.defaults.join(",") : undefined;
        ask(`Allowed values for ${variable.name} (comma-separated)`, defaultValue, (typed, answer) => {
          const values = answer.split(",").map(value => value.trim()).filter(Boolean);
          if (variable.type.startsWith("list(number)") && values.some(value => !Number.isFinite(Number(value)))) {
            return invalid("This variable accepts numbers only.", () => askVariableValues());
          }
          blueprint.variableValues[variable.name] = values;
          variableIndex += 1;
          askVariableValues();
        });
      }

      function showReview() {
        step = "review";
        appendLine("REVIEW", "section");
        appendLine("-------", "muted");
        appendLine(`Blueprint name:  ${blueprint.name}`);
        appendLine(`Source:          ${blueprint.source}@${blueprint.version}`);
        appendLine("Configuration:   Stack");
        appendLine(`Projects:        ${blueprint.projects.join(", ")}`);
        appendLine(`Environments:    ${blueprint.environments.join(", ")}`);
        if (blueprint.tags.length) {
          appendLine("");
          appendLine("Tags:");
          blueprint.tags.forEach(tag => appendLine(`  ${tag.key}: ${tag.value}`));
        }
        if (blueprint.selectedVariables.length) {
          appendLine("");
          appendLine("Variables:");
          blueprint.selectedVariables.forEach(variable => {
            appendLine(`  ${variable.name}`);
            (blueprint.variableValues[variable.name] || []).forEach(value => appendLine(`    - ${value}`));
          });
        }
        ask("Create this blueprint? (Y/n)", "Y", (typed, answer) => {
          if (/^(n|no)$/i.test(answer)) {
            appendLine("Blueprint creation cancelled.", "muted");
            return beginShell();
          }
          if (!/^(y|yes)$/i.test(answer)) return invalid("Enter Y or N.", showReview);
          createBlueprint();
        });
      }

      function createBlueprint() {
        step = "creating";
        input.disabled = true;
        appendLine(`Creating blueprint "${blueprint.name}"...`);
        window.setTimeout(() => {
          const id = `bp-${Math.floor(100000 + Math.random() * 900000)}`;
          appendLine("");
          appendLine("Blueprint created successfully.", "success");
          appendLine(`Blueprint name:  ${blueprint.name}`);
          appendLine(`Blueprint ID:    ${id}`);
          appendLine(`Description:     ${blueprint.description}`);
          appendLine("Configuration:   Stack");
          appendLine(`Projects:        ${blueprint.projects.join(", ")}`);
          appendLine(`Environments:    ${blueprint.environments.join(", ")}`);
          appendLine(`Source:          ${blueprint.source}`);
          appendLine(`Version:         ${blueprint.version}`);
          appendLine(`Tags:            ${blueprint.tags.map(tag => `${tag.key}=${tag.value}`).join(", ") || "—"}`);
          appendLine("Status:          Ready");
          appendLine(`Created at:      ${new Date().toISOString()}`);
          appendLine("");
          beginShell();
        }, 500);
      }

      function invalid(message, retry) {
        appendLine(message, "error");
        retry();
      }

      function cancel() {
        appendLine("^C", "muted");
        appendLine("Blueprint creation cancelled.", "muted");
        beginShell();
      }

      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          const value = input.value.trim();
          if (value && step === "command") {
            commandHistory.push(value);
            historyIndex = commandHistory.length;
          }
          submit();
          return;
        }
        if (event.key === "ArrowUp" && step === "command" && commandHistory.length) {
          event.preventDefault();
          historyIndex = Math.max(0, historyIndex - 1);
          input.value = commandHistory[historyIndex] || "";
        } else if (event.key === "ArrowDown" && step === "command") {
          event.preventDefault();
          historyIndex = Math.min(commandHistory.length, historyIndex + 1);
          input.value = commandHistory[historyIndex] || "";
        } else if (event.key.toLowerCase() === "c" && event.ctrlKey && step !== "command") {
          event.preventDefault();
          cancel();
        }
      });

      document.querySelector(".terminal").addEventListener("click", () => input.focus());
      appendLine("tfctl — self-service blueprint CLI", "muted");
      appendLine("Type `tfctl blueprint create` to get started, or `help` for commands.", "muted");
      appendLine("");
      beginShell();
    </script>
  </body>
</html>
